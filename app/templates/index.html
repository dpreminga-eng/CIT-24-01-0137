<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dockerized Notes App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background: #f4f6f8; }
        h1 { color: #2c3e50; }
        form { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type=text] { flex: 1; padding: 8px; }
        button { padding: 8px 16px; background: #2980b9; color: white; border: none; cursor: pointer; }
        button:hover { background: #1f6391; }
        ul { list-style: none; padding: 0; }
        li { background: white; padding: 10px; margin-bottom: 8px; border-radius: 4px;
             display: flex; justify-content: space-between; align-items: center; }
        .del-btn { background: #c0392b; }
        .del-btn:hover { background: #922b21; }
        small { color: #888; }
    </style>
</head>
<body>
    <h1>📝 Notes App (Flask + PostgreSQL, Dockerized)</h1>
    <form action="/add" method="post">
        <input type="text" name="content" placeholder="Write a note..." required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for note in notes %}
        <li>
            <span>{{ note[1] }} <br><small>{{ note[2] }}</small></span>
            <form action="/delete/{{ note[0] }}" method="post">
                <button class="del-btn" type="submit">Delete</button>
            </form>
        </li>
        {% else %}
        <li>No notes yet. Add one above!</li>
        {% endfor %}
    </ul>
</body>
</html>
