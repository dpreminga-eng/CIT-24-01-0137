version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: notes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespass
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    networks:
      - notes-network

  web:
    build: ./app
    container_name: notes-web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: notes-db
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASS: notespass
    ports:
      - "5000:5000"
    networks:
      - notes-network

networks:
  notes-network:
    driver: bridge

volumes:
  notes-db-data:
